name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # Os testes cobrem as partes puras (KDL, cores, layout, markdown, Store,
      # temas embutidos, protobuf, APNG, URLs de mídia) e não precisam de SDL.
      - run: zig build test
      # O mínimo comum, como na release: o supressor de ruído escolhe o caminho ao rodar.
      - name: Caminhos do supressor de ruído
        run: |
          zig build test -Dcpu=baseline
          for arch in 0 1 2; do LARPER_RNNOISE_ARCH=$arch zig build ruido-custo -Dcpu=baseline; done

  # O build para Windows sai do Linux (as bibliotecas vêm de tools/windows_deps.sh).
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: tools/windows_deps.sh
      - run: zig build -Dtarget=x86_64-windows-gnu -Dqa=true
      - name: Bundle Noto Sans JP
        run: |
          mkdir -p zig-out/bin/fonts
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/38411257417e616c5d4daa1b9e91a3dbcebe1c2e/ofl/notosansjp/NotoSansJP%5Bwght%5D.ttf' -o zig-out/bin/fonts/NotoSansJP.ttf
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/38411257417e616c5d4daa1b9e91a3dbcebe1c2e/ofl/notosansjp/OFL.txt' -o zig-out/bin/fonts/OFL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-qa-build
          path: zig-out/bin/

  # O QA completo num Windows de verdade (sem GPU, então com folga no tempo).
  windows-qa:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-qa-build
          path: bin
      - name: QA
        shell: pwsh
        env:
          SDL_VIDEO_DRIVER: windows
          LARPER_RENDERER: software
          QA_SLOW: "3"
        run: |
          New-Item -ItemType Directory -Force qa-out | Out-Null
          $p = Start-Process -FilePath bin\larpercord.exe -ArgumentList '--qa','--theme','classico' -NoNewWindow -Wait -PassThru -RedirectStandardOutput qa-out\out.txt -RedirectStandardError qa-out\err.txt
          Get-Content qa-out\out.txt,qa-out\err.txt -ErrorAction SilentlyContinue | Select-String -Pattern 'passaram|falharam|^\s+- \[|panic' | ForEach-Object { $_.Line }
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-qa-out
          path: qa-out/

  # O app inteiro (UI, rede, imagens) só compila com as bibliotecas do
  # sistema: roda num Arch, que tem SDL3, libwebp e companhia nos pacotes.
  # Depois, o QA completo fora da tela, com os dados de demonstração.
  build-and-qa:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed git pkgconf sdl3 curl zlib freetype2 fontconfig libwebp opus noto-fonts noto-fonts-emoji
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build
      - run: ./tools/qa.sh
        env:
          SDL_VIDEO_DRIVER: offscreen
          QA_SLOW: "3"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-qa-out
          path: qa-out/
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-out
          path: qa-out/
